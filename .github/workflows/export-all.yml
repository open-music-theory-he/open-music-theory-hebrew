name: Export everything as one ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-export.txt
            scripts/requirements-audiobook.txt
      - name: Install export tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core fonts-dejavu-core
          python -m pip install -r scripts/requirements-export.txt -r scripts/requirements-audiobook.txt
      - name: Export current PDF and companion material
        run: python scripts/export_book.py
      - name: Read a fixed snapshot of saved audio
        run: |
          mkdir -p dist
          set +e
          git ls-remote --exit-code --heads origin audiobook-data > /tmp/saved-audio-branch
          branch_status=$?
          set -e
          if [ "$branch_status" = 0 ]; then
            git fetch origin audiobook-data
            git worktree add --detach dist/audiobook-state FETCH_HEAD
          elif [ "$branch_status" = 2 ]; then
            mkdir -p dist/audiobook-state
          else
            exit "$branch_status"
          fi
      - name: Export existing audio only, without synthesis
        run: python scripts/export_audiobook.py --tags-only
      - name: Assemble a single download without nested ZIPs
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess, zipfile
          from pathlib import Path
          root = Path('dist/all-material')
          root.mkdir(parents=True, exist_ok=True)
          shutil.copyfile('dist/export/open-music-theory-static.pdf', root/'תאוריית-המוזיקה-הפתוחה.pdf')
          with zipfile.ZipFile('dist/export/open-music-theory-companion.zip') as archive:
              if archive.testzip() is not None:
                  raise RuntimeError('Companion archive checksum failure')
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise RuntimeError('Unsafe companion path')
                  if not entry.is_dir():
                      target = root/'נספחים'/path
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))
          for source in Path('dist/audiobook').rglob('*'):
              if source.is_file() and source.suffix != '.zip':
                  target = root/'ספר-שמע'/source.relative_to('dist/audiobook')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          # Retain saved chunks, receipts, older versions and original audio backups too.
          for source in Path('dist/audiobook-state').rglob('*'):
              if source.is_file() and source.name not in ('.git','.gitignore','concat.txt','working.wav','working.mp3') and not source.name.endswith('.tmp'):
                  target = root/'תיעוד-ומקטעי-שמע'/source.relative_to('dist/audiobook-state')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          report = json.loads(Path('dist/audiobook/progress.json').read_text())
          if report['status'] != 'tags_updated' or report['requests_this_run'] != 0:
              raise RuntimeError('Existing-audio export failed or used synthesis')
          completed = sum(ch['status']=='generated' for ch in report['chapters'])
          for ch in report['chapters']:
              if ch['status'] == 'generated':
                  audio = root/'ספר-שמע'/'chapters'/ch['filename']
                  if hashlib.sha256(audio.read_bytes()).hexdigest() != ch['sha256']:
                      raise RuntimeError('Exported chapter checksum mismatch')
          state = Path('dist/audiobook-state')
          audio_commit = subprocess.check_output(['git','-C',str(state),'rev-parse','HEAD'],text=True).strip() if (state/'.git').exists() else None
          manifest = {'text_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                      'audio_commit':audio_commit,'completed_audio_chapters':completed,
                      'eligible_chapters':len(report['chapters']),'synthesis_requests':0,'files':[]}
          for file in sorted(root.rglob('*')):
              if file.is_file():
                  manifest['files'].append({'path':file.relative_to(root).as_posix(),
                                           'bytes':file.stat().st_size,
                                           'sha256':hashlib.sha256(file.read_bytes()).hexdigest()})
          (root/'מפתח-קבצים.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          (root/'קראו-אותי.txt').write_text('PDF הספר, ספר השמע הזמין, נספחים וכל חומרי המקור בארכיון אחד.\nספר-שמע/chapters מכיל פרקים שלמים. תיעוד-ומקטעי-שמע מכיל גם מקטעים וגיבויים; אלה אינם פרקים שלמים נוספים.\nפרקים שטרם הוקלטו אינם מופקים בריצה זו. שירותי מדיה מקוונים נשמרים כקישורים.\nייחוס ורישיונות נשמרים בנספחים ובחומרי המקור.\n')
          for nested_name in ('open-music-theory-companion.zip','ספר-שמע-בעברית.zip'):
              if any(root.rglob(nested_name)):
                  raise RuntimeError('Unexpected nested export ZIP')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(f'One ZIP download: PDF, companion material, {completed} completed audiobook chapters and saved audio state.\n\nSynthesis requests: 0.\n\nFiles: {len(manifest["files"])}.\n')
          PY
      - name: Publish one ZIP download containing everything
        uses: actions/upload-artifact@v4
        with:
          name: open-music-theory-everything
          path: dist/all-material/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
