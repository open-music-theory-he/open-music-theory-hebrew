name: Hebrew audiobook v2 — 116 approved chapters
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate audio or validate preparation without API calls
        type: choice
        options: [generate, prepare]
        default: generate
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  actions: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/guard_audiobook_v2.py
  audiobook:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    concurrency:
      group: hebrew-audiobook-v2
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audiobook.txt
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r scripts/requirements-audiobook.txt
      - name: Validate rotation, deadline, pronunciation and approved batch
        run: python -m unittest discover -s scripts -p 'test_audiobook_v2.py' -v
      - name: Restore approved opening and independent persistent state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p dist/audition-source
          git fetch origin audiobook-auditions
          git show FETCH_HEAD:00-introduction.mp3 > dist/audition-source/00-introduction.mp3
          git show FETCH_HEAD:00-introduction.json > dist/audition-source/00-introduction.json
          set +e
          git ls-remote --exit-code --heads origin audiobook-v2-data > /tmp/v2-branch
          branch_status=$?
          set -e
          if [ "$branch_status" = 0 ]; then
            git fetch origin audiobook-v2-data
            git worktree add --detach dist/audiobook-v2-state FETCH_HEAD
          elif [ "$branch_status" = 2 ]; then
            git worktree add --detach --no-checkout dist/audiobook-v2-state HEAD
            git -C dist/audiobook-v2-state switch --orphan audiobook-v2-data
          else
            exit "$branch_status"
          fi
          printf 'working.wav\nworking.mp3\n*.tmp\nconcat.txt\n' > dist/audiobook-v2-state/.gitignore
      - name: Prepare only
        if: inputs.mode == 'prepare'
        run: python -u scripts/export_audiobook_v2.py --prepare-only
      - name: Generate serially for 5.5 hours plus the current call
        if: inputs.mode != 'prepare'
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          AUDIOBOOK_COMMIT_CHECKPOINT: 'true'
        run: python -u scripts/export_audiobook_v2.py
      - name: Back up state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-v2-recovery
          path: dist/audiobook-v2-state/
          retention-days: 30
          compression-level: 0
      - name: Save completed chapters and progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-v2-chapters
          path: |
            dist/audiobook-v2-state/chapters/
            dist/audiobook-v2-state/progress.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
