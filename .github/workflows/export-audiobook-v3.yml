name: Hebrew audiobook v3 — isolated manual production
on:
  # Automatically resume approved narration every four hours; existing approval and quota safeguards remain active.
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preparation validates drafts without API calls; generation requires every approval gate
        type: choice
        options: [prepare, generate]
        default: prepare
      chapters:
        description: Chapter IDs separated by commas, or all (only text-checked inputs can generate)
        type: string
        default: all
permissions:
  contents: write
concurrency:
  group: hebrew-audiobook-v3
  cancel-in-progress: false
jobs:
  audiobook-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audiobook.txt
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-audiobook.txt
      - name: Validate v3 isolation and fail-closed approvals
        run: python -m unittest discover -s scripts -p 'test_audiobook_v3.py' -v
      - name: Extract reviewed input bundle safely
        run: python scripts/export_audiobook_v3.py --unpack-inputs narration-v3/inputs.zip
      - name: Audit preparation without API calls
        if: inputs.mode == 'prepare'
        env:
          CHAPTER_SELECTION: ${{ inputs.chapters || 'all' }}
        run: python scripts/export_audiobook_v3.py --prepare-only --chapters "$CHAPTER_SELECTION"
      - name: Validate production approvals before tools, secrets, or state writes
        if: github.event_name == 'schedule' || inputs.mode == 'generate'
        env:
          CHAPTER_SELECTION: ${{ inputs.chapters || 'all' }}
        run: python scripts/export_audiobook_v3.py --validate-production --chapters "$CHAPTER_SELECTION"
      - name: Install audio encoding tools
        if: github.event_name == 'schedule' || inputs.mode == 'generate'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Restore independent v3 state (never v2)
        if: github.event_name == 'schedule' || inputs.mode == 'generate'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git ls-remote --exit-code --heads origin audiobook-v3-data > /tmp/audiobook-v3-branch
          branch_status=$?
          set -e
          mkdir -p dist
          if [ "$branch_status" = 0 ]; then
            git fetch --no-tags origin audiobook-v3-data
            git worktree add --detach dist/audiobook-v3-state FETCH_HEAD
          elif [ "$branch_status" = 2 ]; then
            git worktree add --detach --no-checkout dist/audiobook-v3-state HEAD
            git -C dist/audiobook-v3-state switch --orphan audiobook-v3-data
          else
            exit "$branch_status"
          fi
          printf '*.tmp\nworking.wav\nworking.mp3\nconcat.txt\n' > dist/audiobook-v3-state/.gitignore
      - name: Generate approved v3 inputs only, preserving legacy recordings
        if: github.event_name == 'schedule' || inputs.mode == 'generate'
        env:
          CHAPTER_SELECTION: ${{ inputs.chapters || 'all' }}
          GEMINI_API_KAYS: ${{ secrets.GEMINI_API_KAYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          AUDIOBOOK_V3_COMMIT_CHECKPOINT: 'true'
        run: python -u scripts/export_audiobook_v3.py --chapters "$CHAPTER_SELECTION"
      - name: Package sanitized v3 recovery archive
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'generate')
        run: |
          if [ -d dist/audiobook-v3-state ]; then
            python scripts/export_audiobook_v3.py --archive dist/audiobook-v3-recovery.zip
          fi
      - name: Save independent v3 preparation report
        if: always() && inputs.mode == 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-v3-preparation
          path: dist/audiobook-v3-validation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save independent v3 state archive
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'generate')
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-v3-recovery
          path: dist/audiobook-v3-recovery.zip
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
